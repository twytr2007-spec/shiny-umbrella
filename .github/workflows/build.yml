              config.module_search_paths_set = 1;
              {
                  char dyn[4096];
                  snprintf(dyn, sizeof(dyn), "%s/lib-dynload", libdir);
                  const char *paths[2] = { libdir, dyn };
                  for (int i = 0; i < 2; i++) {
                      wchar_t *w = Py_DecodeLocale(paths[i], NULL);
                      if (!w) { set_err(err, errlen, "could not decode path"); PyConfig_Clear(&config); return -3; }
                      status = PyWideStringList_Append(&config.module_search_paths, w);
                      PyMem_RawFree(w);
                      if (PyStatus_Exception(status)) goto fail;
                  }
              }

              status = Py_InitializeFromConfig(&config);
              if (PyStatus_Exception(status)) goto fail;
              PyConfig_Clear(&config);

              PyObject *main_mod = PyImport_AddModule("__main__");
              PyObject *dict = main_mod ? PyModule_GetDict(main_mod) : NULL;
              PyObject *res = dict ? PyRun_String(bootstrap, Py_file_input, dict, dict) : NULL;
              if (!res) {
                  char buf[600];
                  const char *tname = "error";
                  const char *msg = NULL;
                  PyObject *t = NULL, *v = NULL, *tb = NULL, *str = NULL;
                  PyErr_Fetch(&t, &v, &tb);
                  PyErr_NormalizeException(&t, &v, &tb);
                  if (t) tname = ((PyTypeObject *)t)->tp_name;
                  if (v) str = PyObject_Str(v);
                  if (str) msg = PyUnicode_AsUTF8(str);
                  snprintf(buf, sizeof(buf), "bootstrap script failed: %s: %s", tname, msg ? msg : "(no message)");
                  set_err(err, errlen, buf);
                  PyErr_Clear();
                  return -4;
              }
              Py_DECREF(res);

              g_run_fn = dict ? PyDict_GetItemString(dict, "_ide_run") : NULL;
              g_repl_fn = dict ? PyDict_GetItemString(dict, "_ide_repl") : NULL;
              if (!g_run_fn || !g_repl_fn) {
                  set_err(err, errlen, "runner functions missing");
                  return -5;
              }
              Py_INCREF(g_run_fn);
              Py_INCREF(g_repl_fn);

              PyEval_SaveThread();
              return 0;

          fail:
              set_err(err, errlen, status.err_msg);
              PyConfig_Clear(&config);
              return -6;
          }

          void ide_py_run(const char *code, const char *name) {
              PyGILState_STATE st = PyGILState_Ensure();
              g_run_thread = PyThread_get_thread_ident();
              PyObject *r = PyObject_CallFunction(g_run_fn, "ss", code, name);
              if (!r) PyErr_Print(); else Py_DECREF(r);
              g_run_thread = 0;
              PyGILState_Release(st);
          }

          void ide_py_repl(const char *line) {
              PyGILState_STATE st = PyGILState_Ensure();
              g_run_thread = PyThread_get_thread_ident();
              PyObject *r = PyObject_CallFunction(g_repl_fn, "s", line);
              if (!r) PyErr_Print(); else Py_DECREF(r);
              g_run_thread = 0;
              PyGILState_Release(st);
          }

          void ide_py_interrupt(void) {
              unsigned long t = g_run_thread;
              if (!t) return;
              PyGILState_STATE st = PyGILState_Ensure();
              PyThreadState_SetAsyncExc(t, PyExc_KeyboardInterrupt);
              PyGILState_Release(st);
          }
          CODEIDE_UPD_1
          if [ ! -f requirements-ios.txt ]; then
          printf '# One package per line (for example: numpy). They are compiled into the app at build time.\n# Only packages that publish iOS wheels will work.\n' > requirements-ios.txt
          fi
          touch .update-fix-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Python startup and report bootstrap errors"
          git push origin HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Python for iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'Python-3.13-iOS-support' | head -1)
          if [ -z "$URL" ]; then
            URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'iOS-support' | head -1)
          fi
          echo "Downloading: $URL"
          test -n "$URL"
          curl -L --fail -o py.tar.gz "$URL"
          mkdir -p pysupport
          tar -xzf py.tar.gz -C pysupport
          cp -R pysupport/Python.xcframework .
          ls Python.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project CodeIDE.xcodeproj -scheme CodeIDE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
            echo "===== ERRORS ====="
            grep -E "error:" build.log | sort -u | head -n 40
            echo "===== LAST LINES ====="
            tail -n 60 build.log
            exit 1
          }
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "CodeIDE.app" | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          SLICE=""
          for d in Python.xcframework/ios-*; do
            case "$d" in *simulator*) ;; *) SLICE="$d" ;; esac
          done
          test -n "$SLICE"
          LIBDYN=""
          for d in $(find Python.xcframework -type d -name lib-dynload); do
            case "$d" in *simulator*) continue ;; esac
            if ls "$d" | grep -q iphoneos; then LIBDYN="$d"; break; fi
          done
          if [ -z "$LIBDYN" ]; then
            echo "lib-dynload not found. Tree:"
            find Python.xcframework -maxdepth 4 | head -n 60
            exit 1
          fi
          LIBSRC=$(dirname "$LIBDYN")
          PYVER=$(basename "$LIBSRC")
          echo "Python stdlib: $LIBSRC ($PYVER)"
          DEST="$APP/python/lib/$PYVER"
          mkdir -p "$DEST" "$APP/Frameworks"
          for d in $(find Python.xcframework -type d -name "$PYVER" -not -path "*simulator*"); do
            if [ -d "$d/encodings" ] || [ -d "$d/lib-dynload" ]; then
              echo "Merging $d"
              cp -R "$d/." "$DEST/"
            fi
          done
          if [ ! -d "$DEST/encodings" ]; then
            echo "stdlib (encodings) not found. Tree:"
            find Python.xcframework -maxdepth 5 | head -n 80
            exit 1
          fi
          rm -rf "$DEST/test" "$DEST/idlelib" "$DEST/turtledemo" "$DEST/ensurepip" "$DEST/tkinter" "$DEST"/config-*
          find "$DEST" -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          find "$DEST" -type d -name "tests" -prune -exec rm -rf {} + || true
          [ -d "$APP/Frameworks/Python.framework" ] || cp -R "$SLICE/Python.framework" "$APP/Frameworks/"

          convert_dir() {
            BASE="$1"
            find "$BASE" -name "*.so" > /tmp/so.list
            COUNT=0
            while read -r SO; do
              REL="${SO#$BASE/}"
              DIRP=$(dirname "$REL")
              NAME=$(basename "$REL")
              STEM=${NAME%%.*}
              if [ "$DIRP" = "." ]; then FULL="$STEM"; else FULL="$(echo "$DIRP" | tr '/' '.').$STEM"; fi
              FW="$APP/Frameworks/$FULL.framework"
              mkdir -p "$FW"
              mv "$SO" "$FW/$FULL"
              install_name_tool -id "@rpath/$FULL.framework/$FULL" "$FW/$FULL"
              echo "Frameworks/$FULL.framework/$FULL" > "${SO%.so}.fwork"
              RELAPP="${SO#$APP/}"
              echo "${RELAPP%.so}.fwork" > "$FW/$FULL.origin"
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>CFBundleExecutable</key><string>%s</string><key>CFBundleIdentifier</key><string>com.codeide.pymod.x%s</string><key>CFBundleInfoDictionaryVersion</key><string>6.0</string><key>CFBundleName</key><string>%s</string><key>CFBundlePackageType</key><string>FMWK</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>\n' "$FULL" "${FULL//_/-}" "$FULL" > "$FW/Info.plist"
              COUNT=$((COUNT+1))
            done < /tmp/so.list
            echo "Converted $COUNT extension modules in $BASE"
          }

          convert_dir "$DEST/lib-dynload"

          if [ -f requirements-ios.txt ] && grep -qvE '^[[:space:]]*(#|$)' requirements-ios.txt; then
            echo "Bundling packages from requirements-ios.txt"
            PYMM=${PYVER#python}
            PLAT=""
            for v in 12 13 14 15 16 17 18 26; do PLAT="$PLAT --platform ios_${v}_0_arm64_iphoneos"; done
            rm -rf pkgs
            if python -m pip install --upgrade pip > /dev/null 2>&1 && python -m pip install --target pkgs $PLAT --python-version "$PYMM" --implementation cp --abi "cp${PYMM//./}" --only-binary=:all: --extra-index-url https://pypi.anaconda.org/beeware/simple -r requirements-ios.txt; then
              mkdir -p "$DEST/site-packages"
              cp -R pkgs/. "$DEST/site-packages/"
              find "$DEST/site-packages" -name "__pycache__" -type d -prune -exec rm -rf {} + || true
              convert_dir "$DEST/site-packages"
              echo "Bundled packages:"
              ls "$DEST/site-packages" | head -n 60
            else
              echo "::warning::Could not install requirements-ios.txt for iOS (a package may have no iOS wheel). Building without them."
            fi
          fi

          ls "$APP/Frameworks" | wc -l
          rm -rf Payload CodeIDE.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CodeIDE.ipa Payload
          ls -lh CodeIDE.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeIDE-ipa
          path: CodeIDE.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CodeIDE.ipa --title "Latest build" --notes "Unsigned IPA. Install it with AltStore or Sideloadly."
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/latest"

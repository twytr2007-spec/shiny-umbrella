              private static func makeContext(term: Terminal, token: Int?) -> JSContext {
                  let ctx = JSContext()!
                  let alive: () -> Bool = {
                      if let t = token { return term.isActive(t) }
                      return true
                  }
                  ctx.exceptionHandler = { _, exc in
                      guard alive() else { return }
                      let message = exc?.toString() ?? "Error"
                      var line = ""
                      if let l = exc?.objectForKeyedSubscript("line"), l.isNumber {
                          line = " (line \(Int(l.toInt32())))"
                      }
                      term.emit(.err, "Uncaught " + message + line + "\n")
                  }
                  let write: @convention(block) (String, String) -> Void = { kind, text in
                      guard alive() else { return }
                      term.emit(kind == "err" ? .err : .out, text)
                  }
                  ctx.setObject(write, forKeyedSubscript: "__write" as NSString)
                  let ask: @convention(block) (String) -> Any = { message in
                      guard alive() else { return NSNull() }
                      let shown = message.isEmpty ? "" : message + " "
                      if let answer = term.readInput(prompt: shown) { return answer }
                      return NSNull()
                  }
                  ctx.setObject(ask, forKeyedSubscript: "__prompt" as NSString)
                  let readFile: @convention(block) (String) -> Any = { path in
                      if let text = try? String(contentsOfFile: path, encoding: .utf8) { return text }
                      return NSNull()
                  }
                  ctx.setObject(readFile, forKeyedSubscript: "__readFile" as NSString)
                  let isFile: @convention(block) (String) -> Bool = { path in
                      var isDir: ObjCBool = false
                      return FileManager.default.fileExists(atPath: path, isDirectory: &isDir) && !isDir.boolValue
                  }
                  ctx.setObject(isFile, forKeyedSubscript: "__isFile" as NSString)
                  let source = prelude
                      .replacingOccurrences(of: "__NM_PATH__", with: PackageManager.nodeModules.path)
                      .replacingOccurrences(of: "__PROJ_PATH__", with: ProjectStore.directory.path)
                  ctx.evaluateScript(source)
                  return ctx
              }

              private static func pump(_ ctx: JSContext, term: Terminal, token: Int) {
                  while term.isActive(token) {
                      let delay = ctx.evaluateScript("__next()")?.toDouble() ?? -1
                      if delay.isNaN || delay < 0 { break }
                      if delay > 0 {
                          Thread.sleep(forTimeInterval: min(delay, 100) / 1000.0)
                          if delay > 100 { continue }
                      }
                      ctx.evaluateScript("__fire()")
                  }
              }

              static func run(code: String, term: Terminal, token: Int) {
                  let ctx = makeContext(term: term, token: token)
                  ctx.evaluateScript(code)
                  pump(ctx, term: term, token: token)
              }

              static func repl(_ line: String, term: Terminal, token: Int) {
                  if replContext == nil { replContext = makeContext(term: term, token: nil) }
                  guard let ctx = replContext else { return }
                  if let result = ctx.evaluateScript(line), !result.isUndefined {
                      var text = ""
                      if result.isString {
                          text = "'" + (result.toString() ?? "") + "'"
                      } else if let f = ctx.objectForKeyedSubscript("__fmt"),
                                let s = f.call(withArguments: [result])?.toString() {
                          text = s
                      }
                      term.emit(.result, text + "\n")
                  }
                  pump(ctx, term: term, token: token)
              }
          }
          CODEIDE_UPD_0
          cat > Sources/Packages.swift <<'CODEIDE_UPD_1'
          import Foundation

          /// Handles `pip install` and `npm install` typed into the terminal.
          enum PackageManager {
              private static func folder(_ name: String) -> URL {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let url = docs.appendingPathComponent(name, isDirectory: true)
                  try? FileManager.default.createDirectory(at: url, withIntermediateDirectories: true)
                  return url
              }

              static var sitePackages: URL { folder("site-packages") }
              static var nodeModules: URL { folder("node_modules") }

              static func isCommand(_ line: String) -> Bool {
                  guard let first = line.split(separator: " ").first else { return false }
                  return first == "pip" || first == "pip3" || first == "npm"
              }

              static func handle(_ line: String, term: Terminal) {
                  let parts = line.split(separator: " ").map(String.init)
                  guard let tool = parts.first else { return }
                  let sub = parts.count > 1 ? parts[1] : ""
                  let args = parts.dropFirst(2).filter { !$0.hasPrefix("-") }
                  let isNpm = tool == "npm"
                  switch sub {
                  case "install", "i", "add":
                      if args.isEmpty {
                          term.emit(.err, "Usage: \(tool) install <package> [<package> ...]\n")
                          return
                      }
                      if isNpm { npmInstall(Array(args), term: term) } else { pipInstall(Array(args), term: term) }
                  case "list", "ls":
                      list(isNpm: isNpm, term: term)
                  default:
                      term.emit(.info, "Supported commands: \(tool) install <package>, \(tool) list\n")
                  }
              }

              private static func list(isNpm: Bool, term: Terminal) {
                  let fm = FileManager.default
                  var names: [String]
                  if isNpm {
                      let items = (try? fm.contentsOfDirectory(atPath: nodeModules.path)) ?? []
                      names = items.filter { !$0.hasPrefix(".") }.sorted()
                  } else {
                      let items = (try? fm.contentsOfDirectory(atPath: sitePackages.path)) ?? []
                      names = items.filter { $0.hasSuffix(".dist-info") }.map { String($0.dropLast(10)) }.sorted()
                  }
                  term.emit(.out, names.isEmpty ? "(no packages installed)\n" : names.joined(separator: "\n") + "\n")
              }

              private static func fetch(_ url: URL) -> Data? {
                  var result: Data?
                  let sem = DispatchSemaphore(value: 0)
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 60
                  URLSession.shared.dataTask(with: request) { data, response, _ in
                      if let http = response as? HTTPURLResponse, http.statusCode == 200 { result = data }
                      sem.signal()
                  }.resume()
                  sem.wait()
                  return result
              }

              // MARK: pip (pure-Python wheels, installed at runtime)

              private static func pipInstall(_ names: [String], term: Terminal) {
                  if let err = PythonEngine.shared.prepare() {
                      term.emit(.err, err + "\n")
                      return
                  }
                  var queue = names
                  var seen = Set<String>()
                  var installed: [String] = []
                  while !queue.isEmpty {
                      let raw = queue.removeFirst()
                      let key = raw.lowercased().replacingOccurrences(of: "_", with: "-")
                      if seen.contains(key) { continue }
                      seen.insert(key)
                      term.emit(.info, "Collecting \(raw)\n")
                      guard let url = URL(string: "https://pypi.org/pypi/\(raw)/json"),
                            let data = fetch(url),
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let info = json["info"] as? [String: Any],
                            let files = json["urls"] as? [[String: Any]] else {
                          term.emit(.err, "ERROR: could not find '\(raw)' on PyPI (check the name and your internet connection)\n")
                          continue
                      }
                      let version = info["version"] as? String ?? "?"
                      guard let wheel = files.first(where: { ($0["filename"] as? String)?.hasSuffix("none-any.whl") == true }),
                            let fileName = wheel["filename"] as? String,
                            let wheelURLString = wheel["url"] as? String,
                            let wheelURL = URL(string: wheelURLString) else {
                          term.emit(.err, "ERROR: \(raw) has no pure-Python wheel because it contains compiled code. Add it to requirements-ios.txt in your repo to bundle it at build time.\n")
                          continue
                      }
                      term.emit(.info, "  Downloading \(fileName)\n")
                      guard let wheelData = fetch(wheelURL) else {
                          term.emit(.err, "ERROR: download failed for \(raw)\n")
                          continue
                      }
                      let tmp = NSTemporaryDirectory() + fileName
                      do {
                          try wheelData.write(to: URL(fileURLWithPath: tmp))
                      } catch {
                          term.emit(.err, "ERROR: could not save \(fileName)\n")
                          continue
                      }
                      let code = "import zipfile\nzipfile.ZipFile(r\"\(tmp)\").extractall(r\"\(sitePackages.path)\")\n"
                      PythonEngine.shared.run(code: code, fileName: "pip")
                      try? FileManager.default.removeItem(atPath: tmp)
                      installed.append("\(raw)-\(version)")

                      if let deps = info["requires_dist"] as? [String] {
                          let skipMarkers = ["extra", "win32", "Windows", "cygwin", "python_version <", "python_version<"]
                          for dep in deps {
                              let pieces = dep.components(separatedBy: ";")
                              let marker = pieces.count > 1 ? pieces[1] : ""
                              if skipMarkers.contains(where: { marker.contains($0) }) { continue }
                              let head = pieces[0].trimmingCharacters(in: .whitespaces)
                              let depName = String(head.prefix(while: { $0.isLetter || $0.isNumber || $0 == "." || $0 == "-" || $0 == "_" }))
                              if !depName.isEmpty { queue.append(depName) }
                          }
                      }
                  }
                  if installed.isEmpty {
                      term.emit(.err, "Nothing was installed.\n")
                  } else {
                      term.emit(.out, "Successfully installed " + installed.joined(separator: " ") + "\n")
                  }
              }

              // MARK: npm (installed at runtime, loaded with require())

              private static func npmInstall(_ specs: [String], term: Terminal) {
                  if let err = PythonEngine.shared.prepare() {
                      term.emit(.err, err + "\n")
                      return
                  }
                  var queue = specs
                  var seen = Set<String>()
                  var installed: [String] = []
                  while !queue.isEmpty {
                      let spec = queue.removeFirst()
                      var name = spec
                      var version = "latest"
                      let start = spec.hasPrefix("@") ? spec.index(after: spec.startIndex) : spec.startIndex
                      if let at = spec[start...].firstIndex(of: "@") {
                          name = String(spec[..<at])
                          version = String(spec[spec.index(after: at)...])
                      }
                      if seen.contains(name) { continue }
                      seen.insert(name)
                      term.emit(.info, "Fetching \(name)\n")
                      let encoded = name.replacingOccurrences(of: "/", with: "%2F")
                      guard let url = URL(string: "https://registry.npmjs.org/\(encoded)/\(version)"),
                            let data = fetch(url),
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let dist = json["dist"] as? [String: Any],
                            let tarball = dist["tarball"] as? String,
                            let tarURL = URL(string: tarball),
                            let archive = fetch(tarURL) else {
                          term.emit(.err, "ERROR: could not download '\(spec)' from the npm registry\n")
                          continue
                      }
                      let resolved = json["version"] as? String ?? version
                      let tmp = NSTemporaryDirectory() + "npm-\(UUID().uuidString).tgz"
                      do {
                          try archive.write(to: URL(fileURLWithPath: tmp))
                      } catch {
                          term.emit(.err, "ERROR: could not save the package archive\n")
                          continue
                      }
                      let dest = nodeModules.appendingPathComponent(name).path
                      let code = """
          import tarfile, os, shutil
          dest = r"\(dest)"
          shutil.rmtree(dest, ignore_errors=True)
          os.makedirs(dest, exist_ok=True)
          with tarfile.open(r"\(tmp)") as t:
              for m in t.getmembers():
                  parts = m.name.split("/", 1)
                  if len(parts) < 2 or not parts[1] or ".." in parts[1].split("/"):
                      continue
                  m.name = parts[1]
                  if m.isfile() or m.isdir():
                      t.extract(m, dest, filter="data")

          """
                      PythonEngine.shared.run(code: code, fileName: "npm")
                      try? FileManager.default.removeItem(atPath: tmp)
                      installed.append("\(name)@\(resolved)")
                      if let deps = json["dependencies"] as? [String: String] {
                          queue.append(contentsOf: deps.keys.sorted())
                      }
                  }
                  if installed.isEmpty {
                      term.emit(.err, "Nothing was installed.\n")
                  } else {
                      term.emit(.out, "Installed " + installed.joined(separator: " ") + "\nUse it with: const x = require(\"name\");\n")
                  }
              }
          }
          CODEIDE_UPD_1
          if [ ! -f requirements-ios.txt ]; then
          printf '# One package per line (for example: numpy). They are compiled into the app at build time.\n# Only packages that publish iOS wheels will work.\n' > requirements-ios.txt
          fi
          touch .update-packages-v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add pip and npm package support"
          git push origin HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Python for iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'Python-3.13-iOS-support' | head -1)
          if [ -z "$URL" ]; then
            URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'iOS-support' | head -1)
          fi
          echo "Downloading: $URL"
          test -n "$URL"
          curl -L --fail -o py.tar.gz "$URL"
          mkdir -p pysupport
          tar -xzf py.tar.gz -C pysupport
          cp -R pysupport/Python.xcframework .
          ls Python.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project CodeIDE.xcodeproj -scheme CodeIDE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
            echo "===== ERRORS ====="
            grep -E "error:" build.log | sort -u | head -n 40
            echo "===== LAST LINES ====="
            tail -n 60 build.log
            exit 1
          }
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "CodeIDE.app" | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          SLICE=""
          for d in Python.xcframework/ios-*; do
            case "$d" in *simulator*) ;; *) SLICE="$d" ;; esac
          done
          test -n "$SLICE"
          LIBDYN=""
          for d in $(find Python.xcframework -type d -name lib-dynload); do
            case "$d" in *simulator*) continue ;; esac
            if ls "$d" | grep -q iphoneos; then LIBDYN="$d"; break; fi
          done
          if [ -z "$LIBDYN" ]; then
            echo "lib-dynload not found. Tree:"
            find Python.xcframework -maxdepth 4 | head -n 60
            exit 1
          fi
          LIBSRC=$(dirname "$LIBDYN")
          PYVER=$(basename "$LIBSRC")
          echo "Python stdlib: $LIBSRC ($PYVER)"
          DEST="$APP/python/lib/$PYVER"
          mkdir -p "$DEST" "$APP/Frameworks"
          for d in $(find Python.xcframework -type d -name "$PYVER" -not -path "*simulator*"); do
            if [ -d "$d/encodings" ] || [ -d "$d/lib-dynload" ]; then
              echo "Merging $d"
              cp -R "$d/." "$DEST/"
            fi
          done
          if [ ! -d "$DEST/encodings" ]; then
            echo "stdlib (encodings) not found. Tree:"
            find Python.xcframework -maxdepth 5 | head -n 80
            exit 1
          fi
          rm -rf "$DEST/test" "$DEST/idlelib" "$DEST/turtledemo" "$DEST/ensurepip" "$DEST/tkinter" "$DEST"/config-*
          find "$DEST" -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          find "$DEST" -type d -name "tests" -prune -exec rm -rf {} + || true
          [ -d "$APP/Frameworks/Python.framework" ] || cp -R "$SLICE/Python.framework" "$APP/Frameworks/"

          convert_dir() {
            BASE="$1"
            find "$BASE" -name "*.so" > /tmp/so.list
            COUNT=0
            while read -r SO; do
              REL="${SO#$BASE/}"
              DIRP=$(dirname "$REL")
              NAME=$(basename "$REL")
              STEM=${NAME%%.*}
              if [ "$DIRP" = "." ]; then FULL="$STEM"; else FULL="$(echo "$DIRP" | tr '/' '.').$STEM"; fi
              FW="$APP/Frameworks/$FULL.framework"
              mkdir -p "$FW"
              mv "$SO" "$FW/$FULL"
              install_name_tool -id "@rpath/$FULL.framework/$FULL" "$FW/$FULL"
              echo "Frameworks/$FULL.framework/$FULL" > "${SO%.so}.fwork"
              RELAPP="${SO#$APP/}"
              echo "${RELAPP%.so}.fwork" > "$FW/$FULL.origin"
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>CFBundleExecutable</key><string>%s</string><key>CFBundleIdentifier</key><string>com.codeide.pymod.x%s</string><key>CFBundleInfoDictionaryVersion</key><string>6.0</string><key>CFBundleName</key><string>%s</string><key>CFBundlePackageType</key><string>FMWK</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>\n' "$FULL" "${FULL//_/-}" "$FULL" > "$FW/Info.plist"
              COUNT=$((COUNT+1))
            done < /tmp/so.list
            echo "Converted $COUNT extension modules in $BASE"
          }

          convert_dir "$DEST/lib-dynload"

          if [ -f requirements-ios.txt ] && grep -qvE '^[[:space:]]*(#|$)' requirements-ios.txt; then
            echo "Bundling packages from requirements-ios.txt"
            PYMM=${PYVER#python}
            PLAT=""
            for v in 12 13 14 15 16 17 18 26; do PLAT="$PLAT --platform ios_${v}_0_arm64_iphoneos"; done
            rm -rf pkgs
            if python -m pip install --upgrade pip > /dev/null 2>&1 && python -m pip install --target pkgs $PLAT --python-version "$PYMM" --implementation cp --abi "cp${PYMM//./}" --only-binary=:all: --extra-index-url https://pypi.anaconda.org/beeware/simple -r requirements-ios.txt; then
              mkdir -p "$DEST/site-packages"
              cp -R pkgs/. "$DEST/site-packages/"
              find "$DEST/site-packages" -name "__pycache__" -type d -prune -exec rm -rf {} + || true
              convert_dir "$DEST/site-packages"
              echo "Bundled packages:"
              ls "$DEST/site-packages" | head -n 60
            else
              echo "::warning::Could not install requirements-ios.txt for iOS (a package may have no iOS wheel). Building without them."
            fi
          fi

          ls "$APP/Frameworks" | wc -l
          rm -rf Payload CodeIDE.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CodeIDE.ipa Payload
          ls -lh CodeIDE.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeIDE-ipa
          path: CodeIDE.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CodeIDE.ipa --title "Latest build" --notes "Unsigned IPA. Install it with AltStore or Sideloadly."
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/latest"

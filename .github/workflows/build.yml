name: Build IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files (first run only)
        run: |
          if [ ! -f project.yml ]; then
          echo "First run: generating project files"
          mkdir -p Sources Sources/Bridge
          cat > .gitignore <<'CODEIDE_EOF_0'
          Python.xcframework/
          pysupport/
          py.tar.gz
          build/
          build.log
          Payload/
          *.ipa
          *.xcodeproj/
          CODEIDE_EOF_0
          cat > Sources/App.swift <<'CODEIDE_EOF_1'
          import SwiftUI

          @main
          struct CodeIDEApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          CODEIDE_EOF_1
          cat > Sources/Bridge/Bridging-Header.h <<'CODEIDE_EOF_2'
          #import "PyBridge.h"
          CODEIDE_EOF_2
          cat > Sources/Bridge/PyBridge.c <<'CODEIDE_EOF_3'
          #include <Python/Python.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "PyBridge.h"

          static ide_out_cb g_out = NULL;
          static ide_in_cb g_in = NULL;
          static unsigned long g_run_thread = 0;
          static PyObject *g_run_fn = NULL;
          static PyObject *g_repl_fn = NULL;

          static void set_err(char *err, int len, const char *msg) {
              if (err && len > 0) {
                  strncpy(err, msg ? msg : "unknown error", (size_t)(len - 1));
                  err[len - 1] = 0;
              }
          }

          static PyObject *bridge_write(PyObject *self, PyObject *args) {
              int stream;
              const char *text;
              if (!PyArg_ParseTuple(args, "is", &stream, &text)) return NULL;
              if (g_out) g_out(stream, text);
              Py_RETURN_NONE;
          }

          static PyObject *bridge_read(PyObject *self, PyObject *args) {
              const char *prompt;
              if (!PyArg_ParseTuple(args, "s", &prompt)) return NULL;
              char *line = NULL;
              if (g_in) {
                  Py_BEGIN_ALLOW_THREADS
                  line = g_in(prompt);
                  Py_END_ALLOW_THREADS
              }
              if (!line) {
                  PyErr_SetNone(PyExc_EOFError);
                  return NULL;
              }
              PyObject *result = PyUnicode_FromString(line);
              free(line);
              return result;
          }

          static PyMethodDef bridge_methods[] = {
              {"write", bridge_write, METH_VARARGS, "write(stream, text)"},
              {"read", bridge_read, METH_VARARGS, "read(prompt) -> str"},
              {NULL, NULL, 0, NULL}
          };

          static struct PyModuleDef bridge_module = {
              PyModuleDef_HEAD_INIT, "_ide_bridge", NULL, -1, bridge_methods
          };

          static PyObject *PyInit__ide_bridge(void) {
              return PyModule_Create(&bridge_module);
          }

          int ide_py_init(const char *home, const char *executable, const char *libdir,
                          const char *bootstrap, ide_out_cb out, ide_in_cb inp,
                          char *err, int errlen) {
              g_out = out;
              g_in = inp;

              PyStatus status;
              PyPreConfig preconfig;
              PyPreConfig_InitIsolatedConfig(&preconfig);
              preconfig.utf8_mode = 1;
              status = Py_PreInitialize(&preconfig);
              if (PyStatus_Exception(status)) {
                  set_err(err, errlen, status.err_msg);
                  return -1;
              }

              if (PyImport_AppendInittab("_ide_bridge", PyInit__ide_bridge) == -1) {
                  set_err(err, errlen, "could not register bridge module");
                  return -2;
              }

              PyConfig config;
              PyConfig_InitIsolatedConfig(&config);
              config.write_bytecode = 0;
              config.buffered_stdio = 0;
              config.install_signal_handlers = 0;
              config.parse_argv = 0;

              status = PyConfig_SetBytesString(&config, &config.home, home);
              if (PyStatus_Exception(status)) goto fail;
              status = PyConfig_SetBytesString(&config, &config.executable, executable);
              if (PyStatus_Exception(status)) goto fail;
              status = PyConfig_SetBytesString(&config, &config.program_name, executable);
              if (PyStatus_Exception(status)) goto fail;

              config.module_search_paths_set = 1;
              {
                  char dyn[4096];
                  snprintf(dyn, sizeof(dyn), "%s/lib-dynload", libdir);
                  const char *paths[2] = { libdir, dyn };
                  for (int i = 0; i < 2; i++) {
                      wchar_t *w = Py_DecodeLocale(paths[i], NULL);
                      if (!w) { set_err(err, errlen, "could not decode path"); PyConfig_Clear(&config); return -3; }
                      status = PyWideStringList_Append(&config.module_search_paths, w);
                      PyMem_RawFree(w);
                      if (PyStatus_Exception(status)) goto fail;
                  }
              }

              status = Py_InitializeFromConfig(&config);
              if (PyStatus_Exception(status)) goto fail;
              PyConfig_Clear(&config);

              if (PyRun_SimpleString(bootstrap) != 0) {
                  set_err(err, errlen, "bootstrap script failed");
                  return -4;
              }

              PyObject *main_mod = PyImport_AddModule("__main__");
              PyObject *dict = main_mod ? PyModule_GetDict(main_mod) : NULL;
              g_run_fn = dict ? PyDict_GetItemString(dict, "_ide_run") : NULL;
              g_repl_fn = dict ? PyDict_GetItemString(dict, "_ide_repl") : NULL;
              if (!g_run_fn || !g_repl_fn) {
                  set_err(err, errlen, "runner functions missing");
                  return -5;
              }
              Py_INCREF(g_run_fn);
              Py_INCREF(g_repl_fn);

              PyEval_SaveThread();
              return 0;

          fail:
              set_err(err, errlen, status.err_msg);
              PyConfig_Clear(&config);
              return -6;
          }

          void ide_py_run(const char *code, const char *name) {
              PyGILState_STATE st = PyGILState_Ensure();
              g_run_thread = PyThread_get_thread_ident();
              PyObject *r = PyObject_CallFunction(g_run_fn, "ss", code, name);
              if (!r) PyErr_Print(); else Py_DECREF(r);
              g_run_thread = 0;
              PyGILState_Release(st);
          }

          void ide_py_repl(const char *line) {
              PyGILState_STATE st = PyGILState_Ensure();
              g_run_thread = PyThread_get_thread_ident();
              PyObject *r = PyObject_CallFunction(g_repl_fn, "s", line);
              if (!r) PyErr_Print(); else Py_DECREF(r);
              g_run_thread = 0;
              PyGILState_Release(st);
          }

          void ide_py_interrupt(void) {
              unsigned long t = g_run_thread;
              if (!t) return;
              PyGILState_STATE st = PyGILState_Ensure();
              PyThreadState_SetAsyncExc(t, PyExc_KeyboardInterrupt);
              PyGILState_Release(st);
          }
          CODEIDE_EOF_3
          cat > Sources/Bridge/PyBridge.h <<'CODEIDE_EOF_4'
          #ifndef PyBridge_h
          #define PyBridge_h

          #pragma clang assume_nonnull begin

          typedef void (*ide_out_cb)(int stream, const char * _Nullable text);
          typedef char * _Nullable (*ide_in_cb)(const char * _Nullable prompt);

          int ide_py_init(const char *home, const char *executable, const char *libdir,
                          const char *bootstrap, ide_out_cb out, ide_in_cb inp,
                          char *err, int errlen);
          void ide_py_run(const char *code, const char *name);
          void ide_py_repl(const char *line);
          void ide_py_interrupt(void);

          #pragma clang assume_nonnull end

          #endif
          CODEIDE_EOF_4
          cat > Sources/CodeEditor.swift <<'CODEIDE_EOF_5'
          import SwiftUI
          import UIKit

          struct CodeEditor: UIViewRepresentable {
              @Binding var text: String
              var language: Language
              var theme: Theme
              var fontSize: CGFloat

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              func makeUIView(context: Context) -> UITextView {
                  let tv = UITextView()
                  let c = context.coordinator
                  c.textView = tv
                  tv.delegate = c
                  tv.autocorrectionType = .no
                  tv.autocapitalizationType = .none
                  tv.smartQuotesType = .no
                  tv.smartDashesType = .no
                  tv.smartInsertDeleteType = .no
                  tv.spellCheckingType = .no
                  tv.backgroundColor = .clear
                  tv.alwaysBounceVertical = true
                  tv.keyboardDismissMode = .interactive
                  tv.textContainerInset = UIEdgeInsets(top: 12, left: 8, bottom: 12, right: 8)
                  tv.inputAccessoryView = c.makeAccessory()
                  tv.text = text
                  c.applyAppearance(tv)
                  c.highlight(tv)
                  return tv
              }

              func updateUIView(_ tv: UITextView, context: Context) {
                  let c = context.coordinator
                  c.parent = self
                  if tv.text != text {
                      tv.text = text
                      c.highlight(tv)
                  }
                  let key = "\(theme.id)-\(language.rawValue)-\(fontSize)"
                  if key != c.lastKey {
                      c.applyAppearance(tv)
                      c.highlight(tv)
                  }
              }

              final class Coordinator: NSObject, UITextViewDelegate {
                  var parent: CodeEditor
                  weak var textView: UITextView?
                  var lastKey = ""

                  init(_ parent: CodeEditor) { self.parent = parent }

                  func applyAppearance(_ tv: UITextView) {
                      lastKey = "\(parent.theme.id)-\(parent.language.rawValue)-\(parent.fontSize)"
                      tv.tintColor = parent.theme.ui(parent.theme.accent)
                      tv.keyboardAppearance = parent.theme.isDark ? .dark : .light
                  }

                  func textViewDidChange(_ tv: UITextView) {
                      parent.text = tv.text
                      highlight(tv)
                  }

                  func textView(_ tv: UITextView, shouldChangeTextIn range: NSRange, replacementText text: String) -> Bool {
                      guard text == "\n" else { return true }
                      let ns = tv.text as NSString
                      let lineStart = ns.lineRange(for: NSRange(location: range.location, length: 0)).location
                      let before = ns.substring(with: NSRange(location: lineStart, length: range.location - lineStart))
                      var indent = String(before.prefix(while: { $0 == " " || $0 == "\t" }))
                      let trimmed = before.trimmingCharacters(in: .whitespaces)
                      if trimmed.hasSuffix(":") || trimmed.hasSuffix("{") || trimmed.hasSuffix("(") || trimmed.hasSuffix("[") {
                          indent += "    "
                      }
                      if indent.isEmpty { return true }
                      tv.insertText("\n" + indent)
                      return false
                  }

                  func highlight(_ tv: UITextView) {
                      guard tv.markedTextRange == nil else { return }
                      let theme = parent.theme
                      let font = UIFont.monospacedSystemFont(ofSize: parent.fontSize, weight: .regular)
                      let style = NSMutableParagraphStyle()
                      style.lineSpacing = 4
                      let base: [NSAttributedString.Key: Any] = [
                          .font: font,
                          .foregroundColor: theme.ui(theme.text),
                          .paragraphStyle: style
                      ]
                      let storage = tv.textStorage
                      let string = storage.string
                      let ns = string as NSString
                      let full = NSRange(location: 0, length: ns.length)
                      storage.beginEditing()
                      storage.setAttributes(base, range: full)
                      for rule in Highlighter.rules(for: parent.language) {
                          rule.regex.enumerateMatches(in: string, options: [], range: full) { match, _, _ in
                              guard let m = match else { return }
                              let role: Theme.Role
                              if let fixed = rule.role {
                                  role = fixed
                              } else if let classify = rule.classify {
                                  role = classify(ns.substring(with: m.range))
                              } else {
                                  return
                              }
                              storage.addAttribute(.foregroundColor, value: theme.ui(theme.hex(for: role)), range: m.range)
                          }
                      }
                      storage.endEditing()
                      tv.typingAttributes = base
                  }

                  // MARK: Symbol bar above the keyboard

                  private struct Key {
                      let label: String
                      let insert: String
                      let back: Int
                  }

                  func makeAccessory() -> UIView {
                      let bar = UIInputView(frame: CGRect(x: 0, y: 0, width: 320, height: 44), inputViewStyle: .keyboard)
                      let scroll = UIScrollView()
                      scroll.showsHorizontalScrollIndicator = false
                      scroll.translatesAutoresizingMaskIntoConstraints = false
                      let stack = UIStackView()
                      stack.axis = .horizontal
                      stack.spacing = 6
                      stack.alignment = .fill
                      stack.translatesAutoresizingMaskIntoConstraints = false
                      bar.addSubview(scroll)
                      scroll.addSubview(stack)
                      NSLayoutConstraint.activate([
                          scroll.leadingAnchor.constraint(equalTo: bar.leadingAnchor),
                          scroll.trailingAnchor.constraint(equalTo: bar.trailingAnchor),
                          scroll.topAnchor.constraint(equalTo: bar.topAnchor),
                          scroll.bottomAnchor.constraint(equalTo: bar.bottomAnchor),
                          stack.leadingAnchor.constraint(equalTo: scroll.contentLayoutGuide.leadingAnchor, constant: 8),
                          stack.trailingAnchor.constraint(equalTo: scroll.contentLayoutGuide.trailingAnchor, constant: -8),
                          stack.topAnchor.constraint(equalTo: scroll.contentLayoutGuide.topAnchor, constant: 5),
                          stack.bottomAnchor.constraint(equalTo: scroll.contentLayoutGuide.bottomAnchor, constant: -5),
                          stack.heightAnchor.constraint(equalTo: scroll.frameLayoutGuide.heightAnchor, constant: -10)
                      ])

                      let keys: [Key] = [
                          Key(label: "⇥", insert: "    ", back: 0),
                          Key(label: "( )", insert: "()", back: 1),
                          Key(label: "[ ]", insert: "[]", back: 1),
                          Key(label: "{ }", insert: "{}", back: 1),
                          Key(label: "\" \"", insert: "\"\"", back: 1),
                          Key(label: "' '", insert: "''", back: 1),
                          Key(label: ":", insert: ":", back: 0),
                          Key(label: "=", insert: "=", back: 0),
                          Key(label: ".", insert: ".", back: 0),
                          Key(label: ",", insert: ",", back: 0),
                          Key(label: "_", insert: "_", back: 0),
                          Key(label: "#", insert: "#", back: 0),
                          Key(label: "+", insert: "+", back: 0),
                          Key(label: "-", insert: "-", back: 0),
                          Key(label: "*", insert: "*", back: 0),
                          Key(label: "/", insert: "/", back: 0),
                          Key(label: "\\", insert: "\\", back: 0),
                          Key(label: "<", insert: "<", back: 0),
                          Key(label: ">", insert: ">", back: 0),
                          Key(label: "!", insert: "!", back: 0),
                          Key(label: "&", insert: "&", back: 0),
                          Key(label: "|", insert: "|", back: 0),
                          Key(label: "%", insert: "%", back: 0),
                          Key(label: ";", insert: ";", back: 0)
                      ]

                      for key in keys {
                          let button = UIButton(type: .system)
                          button.setTitle(key.label, for: .normal)
                          button.titleLabel?.font = UIFont.monospacedSystemFont(ofSize: 17, weight: .semibold)
                          button.setTitleColor(.label, for: .normal)
                          button.backgroundColor = UIColor.secondarySystemFill
                          button.layer.cornerRadius = 6
                          button.widthAnchor.constraint(greaterThanOrEqualToConstant: 38).isActive = true
                          button.addAction(UIAction { [weak self] _ in
                              guard let tv = self?.textView else { return }
                              tv.insertText(key.insert)
                              if key.back > 0,
                                 let end = tv.selectedTextRange?.end,
                                 let pos = tv.position(from: end, offset: -key.back) {
                                  tv.selectedTextRange = tv.textRange(from: pos, to: pos)
                              }
                          }, for: .touchUpInside)
                          stack.addArrangedSubview(button)
                      }

                      let hide = UIButton(type: .system)
                      hide.setImage(UIImage(systemName: "keyboard.chevron.compact.down"), for: .normal)
                      hide.backgroundColor = UIColor.secondarySystemFill
                      hide.layer.cornerRadius = 6
                      hide.widthAnchor.constraint(greaterThanOrEqualToConstant: 44).isActive = true
                      hide.addAction(UIAction { [weak self] _ in
                          self?.textView?.resignFirstResponder()
                      }, for: .touchUpInside)
                      stack.addArrangedSubview(hide)
                      return bar
                  }
              }
          }
          CODEIDE_EOF_5
          cat > Sources/ContentView.swift <<'CODEIDE_EOF_6'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var store = ProjectStore()
              @ObservedObject private var term = Terminal.shared
              @AppStorage("themeID") private var themeID = "dark"
              @AppStorage("fontSize") private var fontSize = 15.0
              @State private var showFiles = false
              @State private var showNew = false
              @State private var termMode = 1

              private var theme: Theme { Theme.byID(themeID) }

              private func terminalHeight(_ total: CGFloat) -> CGFloat {
                  switch termMode {
                  case 0: return 40
                  case 2: return total * 0.72
                  default: return total * 0.38
                  }
              }

              var body: some View {
                  NavigationStack {
                      GeometryReader { geo in
                          VStack(spacing: 0) {
                              tabsBar
                              CodeEditor(
                                  text: Binding(
                                      get: { store.current?.content ?? "" },
                                      set: { store.updateCurrent($0) }
                                  ),
                                  language: store.current?.language ?? .python,
                                  theme: theme,
                                  fontSize: CGFloat(fontSize)
                              )
                              .id(store.currentName)
                              Divider()
                              TerminalView(
                                  term: term,
                                  theme: theme,
                                  fontSize: fontSize - 1,
                                  language: store.current?.language ?? .python,
                                  mode: $termMode
                              )
                              .frame(height: terminalHeight(geo.size.height))
                          }
                          .background(theme.bgColor)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbarBackground(theme.panelColor, for: .navigationBar)
                      .toolbarBackground(.visible, for: .navigationBar)
                      .toolbarColorScheme(theme.isDark ? .dark : .light, for: .navigationBar)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button { showFiles = true } label: {
                                  Image(systemName: "folder")
                              }
                          }
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 6) {
                                  Image(systemName: store.current?.language.icon ?? "doc")
                                  Text(store.current?.name ?? "")
                                      .font(.system(size: 16, weight: .semibold, design: .monospaced))
                              }
                          }
                          ToolbarItemGroup(placement: .navigationBarTrailing) {
                              optionsMenu
                              Button { runOrStop() } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: term.isRunning ? "stop.fill" : "play.fill")
                                      Text(term.isRunning ? "Stop" : "Run")
                                          .font(.system(size: 15, weight: .semibold))
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 5)
                                  .background(term.isRunning ? Color.red : Color.green)
                                  .foregroundColor(.white)
                                  .clipShape(Capsule())
                              }
                          }
                      }
                      .sheet(isPresented: $showFiles) {
                          FilesSheet(store: store)
                      }
                      .sheet(isPresented: $showNew) {
                          NewFileSheet(store: store)
                      }
                  }
                  .preferredColorScheme(theme.isDark ? .dark : .light)
              }

              private var tabsBar: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 8) {
                          ForEach(store.files) { file in
                              Button {
                                  store.saveNow(store.currentName)
                                  store.currentName = file.name
                              } label: {
                                  HStack(spacing: 5) {
                                      Image(systemName: file.language.icon).font(.system(size: 11))
                                      Text(file.name).font(.system(size: 13, design: .monospaced))
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 6)
                                  .background(file.name == store.currentName ? theme.accentColor.opacity(0.25) : theme.panelColor)
                                  .foregroundColor(file.name == store.currentName ? theme.accentColor : theme.commentColor)
                                  .clipShape(RoundedRectangle(cornerRadius: 8))
                              }
                          }
                          Button { showNew = true } label: {
                              Image(systemName: "plus")
                                  .font(.system(size: 13, weight: .bold))
                                  .padding(8)
                                  .background(theme.panelColor)
                                  .foregroundColor(theme.commentColor)
                                  .clipShape(RoundedRectangle(cornerRadius: 8))
                          }
                      }
                      .padding(.horizontal, 10)
                      .padding(.vertical, 6)
                  }
                  .background(theme.bgColor)
              }

              private var optionsMenu: some View {
                  Menu {
                      Button { showNew = true } label: {
                          Label("New file", systemImage: "doc.badge.plus")
                      }
                      Picker("Theme", selection: $themeID) {
                          ForEach(Theme.all) { t in
                              Text(t.name).tag(t.id)
                          }
                      }
                      Button { fontSize = min(26, fontSize + 1) } label: {
                          Label("Bigger text", systemImage: "textformat.size.larger")
                      }
                      Button { fontSize = max(10, fontSize - 1) } label: {
                          Label("Smaller text", systemImage: "textformat.size.smaller")
                      }
                      if let name = store.current?.name {
                          ShareLink(item: store.url(for: name)) {
                              Label("Share file", systemImage: "square.and.arrow.up")
                          }
                      }
                  } label: {
                      Image(systemName: "ellipsis.circle")
                  }
              }

              private func runOrStop() {
                  if term.isRunning {
                      term.stop()
                      return
                  }
                  guard let file = store.current else { return }
                  store.saveNow(file.name)
                  UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder), to: nil, from: nil, for: nil)
                  if termMode == 0 { termMode = 1 }
                  term.run(code: file.content, language: file.language, fileName: file.name)
              }
          }

          struct FilesSheet: View {
              @ObservedObject var store: ProjectStore
              @Environment(\.dismiss) private var dismiss
              @State private var showNew = false

              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(store.files) { file in
                              Button {
                                  store.saveNow(store.currentName)
                                  store.currentName = file.name
                                  dismiss()
                              } label: {
                                  HStack {
                                      Image(systemName: file.language.icon)
                                      Text(file.name).font(.system(.body, design: .monospaced))
                                      Spacer()
                                      if file.name == store.currentName {
                                          Image(systemName: "checkmark").foregroundColor(.accentColor)
                                      }
                                  }
                                  .foregroundColor(.primary)
                              }
                          }
                          .onDelete { offsets in
                              let names = offsets.map { store.files[$0].name }
                              names.forEach { store.delete($0) }
                          }
                      }
                      .navigationTitle("Files")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button { showNew = true } label: { Image(systemName: "plus") }
                          }
                      }
                      .sheet(isPresented: $showNew, onDismiss: { dismiss() }) {
                          NewFileSheet(store: store)
                      }
                  }
              }
          }

          struct NewFileSheet: View {
              @ObservedObject var store: ProjectStore
              @Environment(\.dismiss) private var dismiss
              @State private var language: Language = .python
              @State private var name = ""
              @State private var templateIndex = 0

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Language") {
                              Picker("Language", selection: $language) {
                                  ForEach(Language.allCases) { l in
                                      Text(l.title).tag(l)
                                  }
                              }
                              .pickerStyle(.segmented)
                              .onChange(of: language) { _ in templateIndex = 0 }
                          }
                          Section("File name") {
                              HStack {
                                  TextField("script", text: $name)
                                      .textInputAutocapitalization(.never)
                                      .autocorrectionDisabled(true)
                                  Text(".\(language.ext)").foregroundColor(.secondary)
                              }
                          }
                          Section("Template") {
                              Picker("Template", selection: $templateIndex) {
                                  ForEach(Array(Templates.list(for: language).enumerated()), id: \.offset) { index, item in
                                      Text(item.title).tag(index)
                                  }
                              }
                              .pickerStyle(.inline)
                              .labelsHidden()
                          }
                      }
                      .navigationTitle("New file")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Cancel") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Create") {
                                  let templates = Templates.list(for: language)
                                  let code = templates[min(templateIndex, templates.count - 1)].code
                                  store.create(baseName: name, language: language, content: code)
                                  dismiss()
                              }
                              .fontWeight(.semibold)
                          }
                      }
                  }
              }
          }
          CODEIDE_EOF_6
          cat > Sources/Highlighter.swift <<'CODEIDE_EOF_7'
          import Foundation

          enum Highlighter {
              struct Rule {
                  let regex: NSRegularExpression
                  let role: Theme.Role?

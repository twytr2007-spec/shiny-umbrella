              private func runREPL(_ line: String, language: Language) {
                  let token = beginRun(language: language)
                  emit(.input, "\(language.prompt) \(line)\n")
                  launch(token: token, silent: true) {
                      switch language {
                      case .python:
                          if let error = PythonEngine.shared.prepare() {

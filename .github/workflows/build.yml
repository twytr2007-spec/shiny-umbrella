                      let delay = ctx.evaluateScript("__next()")?.toDouble() ?? -1
                      if delay.isNaN || delay < 0 { break }
                      if delay > 0 {
                          Thread.sleep(forTimeInterval: min(delay, 100) / 1000.0)
                          if delay > 100 { continue }
                      }
                      ctx.evaluateScript("__fire()")
                  }
              }

              static func run(code: String, term: Terminal, token: Int) {
                  let ctx = makeContext(term: term, token: token)
                  ctx.evaluateScript(code)
                  pump(ctx, term: term, token: token)
              }

              static func repl(_ line: String, term: Terminal, token: Int) {
                  if replContext == nil { replContext = makeContext(term: term, token: nil) }
                  guard let ctx = replContext else { return }
                  if let result = ctx.evaluateScript(line), !result.isUndefined {
                      var text = ""
                      if result.isString {
                          text = "'" + (result.toString() ?? "") + "'"
                      } else if let f = ctx.objectForKeyedSubscript("__fmt"),
                                let s = f.call(withArguments: [result])?.toString() {
                          text = s
                      }
                      term.emit(.result, text + "\n")
                  }
                  pump(ctx, term: term, token: token)
              }
          }
          CODEIDE_EOF_9
          cat > Sources/TerminalView.swift <<'CODEIDE_EOF_10'
          import SwiftUI

          struct TerminalView: View {
              @ObservedObject var term: Terminal
              let theme: Theme
              let fontSize: Double
              let language: Language
              @Binding var mode: Int   // 0 = collapsed, 1 = normal, 2 = large

              @State private var input = ""
              @FocusState private var focused: Bool

              private func color(for kind: Terminal.Kind) -> Color {
                  switch kind {
                  case .out: return theme.textColor
                  case .err: return theme.errorColor
                  case .input: return theme.accentColor
                  case .info: return theme.commentColor
                  case .result: return theme.builtinColor
                  }
              }

              private var mono: Font { .system(size: CGFloat(fontSize), design: .monospaced) }

              var body: some View {
                  VStack(spacing: 0) {
                      header
                      if mode != 0 {
                          ScrollViewReader { proxy in
                              ScrollView {
                                  VStack(alignment: .leading, spacing: 0) {
                                      output
                                      Color.clear.frame(height: 1).id("end")
                                  }
                                  .padding(10)
                              }
                              .onChange(of: term.version) { _ in
                                  proxy.scrollTo("end", anchor: .bottom)
                              }
                          }
                          Divider()
                          inputBar
                      }
                  }
                  .background(theme.panelColor)
              }

              private var header: some View {
                  HStack(spacing: 14) {
                      Circle()
                          .fill(term.isRunning ? Color.green : theme.commentColor.opacity(0.6))
                          .frame(width: 9, height: 9)
                      Text("TERMINAL · \(language.title)")
                          .font(.system(size: 12, weight: .semibold, design: .monospaced))
                          .foregroundColor(theme.commentColor)
                      Spacer()
                      Button { term.clear() } label: {
                          Image(systemName: "trash")
                      }
                      Button { mode = (mode == 2) ? 1 : 2 } label: {
                          Image(systemName: mode == 2 ? "arrow.down.right.and.arrow.up.left" : "arrow.up.left.and.arrow.down.right")
                      }
                      Button { mode = (mode == 0) ? 1 : 0 } label: {
                          Image(systemName: mode == 0 ? "chevron.up" : "chevron.down")
                      }
                  }
                  .font(.system(size: 15))
                  .foregroundColor(theme.commentColor)
                  .padding(.horizontal, 12)
                  .frame(height: 40)
                  .background(theme.panelColor)
              }

              private var output: some View {
                  let combined = term.segs.reduce(Text("")) { (acc: Text, seg: Terminal.Seg) -> Text in
                      acc + Text(seg.text).foregroundColor(color(for: seg.kind))
                  }
                  return Group {
                      if term.segs.isEmpty {
                          Text("Press ▶ to run your code, or type a command below.")
                              .foregroundColor(theme.commentColor)
                      } else {
                          combined
                      }
                  }
                  .font(mono)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .textSelection(.enabled)
              }

              private var promptLabel: String {
                  if term.waitingForInput { return "›" }
                  if term.isRunning { return "…" }
                  return language.prompt
              }

              private var placeholder: String {
                  if term.waitingForInput { return "Type input and press return" }
                  if term.isRunning { return "Running…" }
                  return "Type a \(language.title) command"
              }

              private var inputBar: some View {
                  HStack(spacing: 8) {
                      Text(promptLabel)
                          .font(.system(size: CGFloat(fontSize), weight: .bold, design: .monospaced))
                          .foregroundColor(theme.accentColor)
                      TextField(placeholder, text: $input)
                          .font(mono)
                          .foregroundColor(theme.textColor)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled(true)
                          .submitLabel(.send)
                          .focused($focused)
                          .disabled(term.isRunning && !term.waitingForInput)
                          .onSubmit { send() }
                      Button { send() } label: {
                          Image(systemName: "return")
                              .foregroundColor(theme.accentColor)
                      }
                      .disabled(term.isRunning && !term.waitingForInput)
                  }
                  .padding(.horizontal, 12)
                  .padding(.vertical, 10)
                  .onChange(of: term.waitingForInput) { waiting in
                      if waiting { focused = true }
                  }
              }

              private func send() {
                  let text = input
                  input = ""
                  term.submit(text, language: language)
                  focused = true
              }
          }
          CODEIDE_EOF_10
          cat > Sources/Theme.swift <<'CODEIDE_EOF_11'
          import SwiftUI
          import UIKit

          extension Color {
              init(hex: UInt32) {
                  self.init(red: Double((hex >> 16) & 0xFF) / 255.0,
                            green: Double((hex >> 8) & 0xFF) / 255.0,
                            blue: Double(hex & 0xFF) / 255.0)
              }
          }

          struct Theme: Identifiable {
              enum Role { case keyword, string, comment, number, builtin, function }

              let id: String
              let name: String
              let isDark: Bool
              let bg: UInt32
              let panel: UInt32
              let text: UInt32
              let keyword: UInt32
              let string: UInt32
              let comment: UInt32
              let number: UInt32
              let builtin: UInt32
              let function: UInt32
              let accent: UInt32
              let error: UInt32

              var bgColor: Color { Color(hex: bg) }
              var panelColor: Color { Color(hex: panel) }
              var textColor: Color { Color(hex: text) }
              var commentColor: Color { Color(hex: comment) }
              var accentColor: Color { Color(hex: accent) }
              var errorColor: Color { Color(hex: error) }
              var builtinColor: Color { Color(hex: builtin) }

              func ui(_ hex: UInt32) -> UIColor {
                  UIColor(red: CGFloat((hex >> 16) & 0xFF) / 255.0,
                          green: CGFloat((hex >> 8) & 0xFF) / 255.0,
                          blue: CGFloat(hex & 0xFF) / 255.0,
                          alpha: 1.0)
              }

              func hex(for role: Role) -> UInt32 {
                  switch role {
                  case .keyword: return keyword
                  case .string: return string
                  case .comment: return comment
                  case .number: return number
                  case .builtin: return builtin
                  case .function: return function
                  }
              }

              static let dark = Theme(id: "dark", name: "Midnight", isDark: true,
                  bg: 0x1B1D23, panel: 0x14161A, text: 0xD7DAE0, keyword: 0xFF7AB2, string: 0xFC6A5D,
                  comment: 0x7F8C98, number: 0xD9C97C, builtin: 0x4EB0CC, function: 0x67B7A4,
                  accent: 0x30D158, error: 0xFF5F56)

              static let light = Theme(id: "light", name: "Daylight", isDark: false,
                  bg: 0xFFFFFF, panel: 0xF2F2F7, text: 0x1C1C1E, keyword: 0xAD3DA4, string: 0xD12F1B,
                  comment: 0x6C7986, number: 0x272AD8, builtin: 0x0F68A0, function: 0x326D74,
                  accent: 0x1E9E3F, error: 0xD70015)

              static let dracula = Theme(id: "dracula", name: "Dracula", isDark: true,
                  bg: 0x282A36, panel: 0x1E1F29, text: 0xF8F8F2, keyword: 0xFF79C6, string: 0xF1FA8C,
                  comment: 0x6272A4, number: 0xBD93F9, builtin: 0x8BE9FD, function: 0x50FA7B,
                  accent: 0x50FA7B, error: 0xFF5555)

              static let solar = Theme(id: "solar", name: "Solarized", isDark: true,
                  bg: 0x002B36, panel: 0x00212B, text: 0x93A1A1, keyword: 0x859900, string: 0x2AA198,
                  comment: 0x586E75, number: 0xD33682, builtin: 0x268BD2, function: 0xB58900,
                  accent: 0x2AA198, error: 0xDC322F)

              static let all: [Theme] = [dark, light, dracula, solar]

              static func byID(_ id: String) -> Theme {
                  all.first(where: { $0.id == id }) ?? dark
              }
          }
          CODEIDE_EOF_11
          cat > project.yml <<'CODEIDE_EOF_12'
          name: CodeIDE
          options:
            bundleIdPrefix: com.codeide
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
          targets:
            CodeIDE:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.codeide.app
                  PRODUCT_NAME: CodeIDE
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/Bridging-Header.h
                  TARGETED_DEVICE_FAMILY: "1,2"
              info:
                path: Config/Info.plist
                properties:
                  CFBundleDisplayName: Code IDE
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              dependencies:
                - framework: Python.xcframework
                  embed: true
                  codeSign: false
          CODEIDE_EOF_12
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Code IDE project sources"
          git push origin HEAD
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Python for iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'Python-3.13-iOS-support' | head -1)
          if [ -z "$URL" ]; then
            URL=$(gh api repos/beeware/Python-Apple-support/releases --paginate --jq '.[].assets[].browser_download_url' | grep 'iOS-support' | head -1)
          fi
          echo "Downloading: $URL"
          test -n "$URL"
          curl -L --fail -o py.tar.gz "$URL"
          mkdir -p pysupport
          tar -xzf py.tar.gz -C pysupport
          cp -R pysupport/Python.xcframework .
          ls Python.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project CodeIDE.xcodeproj -scheme CodeIDE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
            echo "===== ERRORS ====="
            grep -E "error:" build.log | sort -u | head -n 40
            echo "===== LAST LINES ====="
            tail -n 60 build.log
            exit 1
          }
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "CodeIDE.app" | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          SLICE=""
          for d in Python.xcframework/ios-*; do
            case "$d" in *simulator*) ;; *) SLICE="$d" ;; esac
          done
          test -n "$SLICE"
          LIBSRC=$(ls -d "$SLICE"/lib/python3.* | head -1)
          PYVER=$(basename "$LIBSRC")
          echo "Python stdlib: $LIBSRC ($PYVER)"
          mkdir -p "$APP/python/lib" "$APP/Frameworks"
          cp -R "$LIBSRC" "$APP/python/lib/"
          DEST="$APP/python/lib/$PYVER"
          rm -rf "$DEST/test" "$DEST/idlelib" "$DEST/turtledemo" "$DEST/ensurepip" "$DEST/tkinter" "$DEST"/config-*
          find "$DEST" -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          find "$DEST" -type d -name "tests" -prune -exec rm -rf {} + || true
          [ -d "$APP/Frameworks/Python.framework" ] || cp -R "$SLICE/Python.framework" "$APP/Frameworks/"
          COUNT=0
          for SO in "$DEST"/lib-dynload/*.so; do
            [ -e "$SO" ] || continue
            NAME=$(basename "$SO")
            MOD=${NAME%%.*}
            FW="$APP/Frameworks/$MOD.framework"
            mkdir -p "$FW"
            mv "$SO" "$FW/$MOD"
            install_name_tool -id "@rpath/$MOD.framework/$MOD" "$FW/$MOD"
            echo "Frameworks/$MOD.framework/$MOD" > "${SO%.so}.fwork"
            echo "python/lib/$PYVER/lib-dynload/${NAME%.so}.fwork" > "$FW/$MOD.origin"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>CFBundleExecutable</key><string>%s</string><key>CFBundleIdentifier</key><string>com.codeide.pymod.x%s</string><key>CFBundleInfoDictionaryVersion</key><string>6.0</string><key>CFBundleName</key><string>%s</string><key>CFBundlePackageType</key><string>FMWK</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>\n' "$MOD" "${MOD//_/-}" "$MOD" > "$FW/Info.plist"
            COUNT=$((COUNT+1))
          done
          echo "Converted $COUNT Python extension modules into frameworks"
          ls "$APP/Frameworks" | head -n 80
          rm -rf Payload CodeIDE.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CodeIDE.ipa Payload
          ls -lh CodeIDE.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeIDE-ipa
          path: CodeIDE.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CodeIDE.ipa --title "Latest build" --notes "Unsigned IPA. Install it with AltStore or Sideloadly."
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/latest"

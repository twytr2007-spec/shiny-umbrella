              func saveNow(_ name: String) {
                  pendingSaves[name]?.cancel()
                  pendingSaves[name] = nil
                  guard let f = files.first(where: { $0.name == name }) else { return }
                  try? f.content.write(to: url(for: name), atomically: true, encoding: .utf8)
              }


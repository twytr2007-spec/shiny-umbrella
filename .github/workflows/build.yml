                  if base.lowercased().hasSuffix("." + language.ext) {
                      base = String(base.dropLast(language.ext.count + 1))
                  }
                  var name = "\(base).\(language.ext)"
                  var i = 2
                  while files.contains(where: { $0.name == name }) {
                      name = "\(base)\(i).\(language.ext)"

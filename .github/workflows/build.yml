          static PyObject *bridge_write(PyObject *self, PyObject *args) {
              int stream;
              const char *text;
              if (!PyArg_ParseTuple(args, "is", &stream, &text)) return NULL;
              if (g_out) g_out(stream, text);
              Py_RETURN_NONE;
